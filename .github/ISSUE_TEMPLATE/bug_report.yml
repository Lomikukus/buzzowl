name: Bug report
description: Something isn't working the way it should
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Git commit hash (`git rev-parse HEAD`) or release tag.
    validations:
      required: true

  - type: dropdown
    id: run-mode
    attributes:
      label: How are you running Buzzowl?
      options:
        - Docker Compose
        - Python venv (python server.py)
        - Other / not sure
    validations:
      required: true

  - type: input
    id: llm-provider
    attributes:
      label: LLM provider
      description: e.g. OpenRouter, Anthropic API, local Ollama/LM Studio, OpenAI-compatible endpoint.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of `docker compose logs <service>` (or server console output) around the time of the failure.
      render: shell
    validations:
      required: false
